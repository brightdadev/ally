[project]
name = "ally"
version = "1.0.1"
description = "Terminal coding assistant powered by Gemini"
authors = [
    { name = "Bright da dev" }
]
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "textual",
    "rich",
    "python-dotenv",
]

[project.scripts]
ally = "tui.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.model", "user", "context", "context.skills", "tui", "tui.screens"]